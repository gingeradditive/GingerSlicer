name: Validate macOS Secrets (temp)

on:
  workflow_dispatch:

jobs:
  validate_macos_secrets:
    name: Validate macOS signing/notary secrets
    runs-on: macos-14
    env:
      BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
      P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      CERTIFICATE_ID: ${{ secrets.MACOS_CERTIFICATE_ID }}
      APPLE_DEV_ACCOUNT: ${{ secrets.APPLE_DEV_ACCOUNT }}
      TEAM_ID: ${{ secrets.TEAM_ID }}
      APP_PWD: ${{ secrets.APP_PWD }}

    steps:
      - name: Check required secrets presence
        shell: bash
        run: |
          missing=0
          for key in BUILD_CERTIFICATE_BASE64 P12_PASSWORD KEYCHAIN_PASSWORD CERTIFICATE_ID APPLE_DEV_ACCOUNT TEAM_ID APP_PWD; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing secret/value: $key"
              missing=1
            else
              echo "::notice::$key is present"
            fi
          done

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Import certificate and verify identity
        shell: bash
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode --output "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$P12_PASSWORD" "$KEYCHAIN_PATH"

          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -F "$CERTIFICATE_ID"

      - name: Validate notarytool credentials
        shell: bash
        run: |
          xcrun notarytool store-credentials "notarytool-profile-temp" \
            --apple-id "$APPLE_DEV_ACCOUNT" \
            --team-id "$TEAM_ID" \
            --password "$APP_PWD"

          xcrun notarytool history --keychain-profile "notarytool-profile-temp" >/dev/null
          echo "::notice::notarytool credentials are valid"

      - name: Cleanup keychain
        if: always()
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" || true
