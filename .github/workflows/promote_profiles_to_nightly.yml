name: Promote profiles to nightly

on:
  workflow_dispatch:
    inputs:
      new_version:
        description: 'New profile version (must be greater than current, e.g. 2.3.3.4)'
        required: true
        type: string

jobs:
  bump_version:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump profile version
        run: |
          python3 ./scripts/bump_profile_version.py "${{ inputs.new_version }}"

      - name: Commit and push version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add resources/profiles/
          git commit -m "Bump profile version to ${{ inputs.new_version }}"
          git push

  check_profiles:
    runs-on: ubuntu-24.04
    needs: bump_version
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Download validator
        run: |
          curl -LJO https://github.com/SoftFever/Orca_tools/releases/download/1/OrcaSlicer_profile_validator
          chmod +x ./OrcaSlicer_profile_validator

      - name: Run validation for each profile version
        run: |
          echo "Validating profiles in ./resources/profiles/"
          python3 ./scripts/orca_extra_profile_check.py
          ./OrcaSlicer_profile_validator -p ./resources/profiles/ -l 2

  release_profiles:
    runs-on: ubuntu-24.04
    needs: check_profiles
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up GitHub CLI
        run: |
          sudo apt update
          sudo apt install gh -y
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload profile packages to nightly-builds release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x ./scripts/pack_profiles.sh
          mkdir -p output

          RELEASE_TAG="nightly-builds"
          REPO="gingeradditive/gingerslicer"
          TIMESTAMP=$(date +%s)

          gh release view "$RELEASE_TAG" --repo "$REPO" >/dev/null

          for dir in ./resources/profiles/*/; do
            VERSION=$(basename "$dir")
            NUMBER="$TIMESTAMP"
            ZIP_NAME="gingerslicer-profiles_ota_${VERSION}.${NUMBER}.zip"
            echo "Packaging $VERSION"

            ./scripts/pack_profiles.sh "$VERSION" "$NUMBER"
            mv "./gingerslicer-profiles_ota_${VERSION}.${NUMBER}.zip" ./output/

            echo "Replacing existing asset for $VERSION in $RELEASE_TAG (if present)"
            EXISTING_ASSET_IDS=$(gh api "repos/$REPO/releases/tags/$RELEASE_TAG" --jq ".assets[] | select(.name | test(\"^gingerslicer-profiles_ota_${VERSION}\\\\..*\\\\.zip$\")) | .id")

            if [ -n "$EXISTING_ASSET_IDS" ]; then
              for asset_id in $EXISTING_ASSET_IDS; do
                gh api --method DELETE "repos/$REPO/releases/assets/$asset_id"
              done
            fi

            gh release upload "$RELEASE_TAG" "./output/$ZIP_NAME" --repo "$REPO"
          done
